plugins {
    id("idea")
}

idea.module {
    excludeDirs += file('out')
}

subprojects {
    plugins.withId("com.android.base") {
        android {
            // Local offline toolchain pin (platforms 36 / bt 35 / ndk 27) — build env only
            compileSdk = 36
            buildToolsVersion = "35.0.0"
            ndkVersion = "27.0.12077973"
            defaultConfig {
                minSdk = 24
                targetSdk = 36
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }
}

apply from: 'api/manifest.gradle.kts'
// App release identity (manager / shell). API protocol version stays in api/manifest.gradle.kts.
ext {
    versionCode = 150000
    versionName = "V15.0.0"
}
